<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bayouta Park - Réception</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f0e8;
    color: #2b2520;
}

/* ================= LOGIN ================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
}

.login-box h1 {
    text-align: center;
    margin-bottom: 10px;
}

.login-box p {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

.login-button {
    width: 100%;
    padding: 14px;
    background: #2b2520;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-error {
    display: none;
    background: #ffebee;
    color: #c62828;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
    text-align: center;
}

/* ================= DASHBOARD ================= */

#dashboard {
    display: none;
}

header {
    background: #2b2520;
    color: #f5f0e8;
    padding: 20px;
    text-align: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 6px;
    opacity: 0.8;
}

.logout-button {
    margin-top: 15px;
    background: #b33a2b;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
}

.status-bar {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 15px;
}

.connection {
    background: #e8f5e9;
    color: #2e7d32;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.orders-container {
    max-width: 1000px;
    margin: auto;
    padding: 0 15px 50px;
}

.status-section {
    margin-bottom: 35px;
}

.status-title {
    font-size: 21px;
    font-weight: bold;
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

/* ================= ORDER CARD ================= */

.order-card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.new-card {
    border-left: 5px solid #d6b77c;
}

.preparing-card {
    border-left: 5px solid #2196f3;
}

.done-card {
    border-left: 5px solid #2e7d32;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.order-number {
    font-size: 18px;
    font-weight: bold;
}

.table {
    background: #d6b77c;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: bold;
}

.customer {
    color: #666;
    margin-bottom: 10px;
}

.order-time {
    color: #777;
    font-size: 13px;
    margin-bottom: 15px;
}

.items {
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    padding: 12px 0;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
}

.total {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
    padding: 15px 0;
}

button.action-button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.accept-button {
    background: #2196f3;
}

.delivered-button {
    background: #2e7d32;
}

.no-orders {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    color: #777;
}

@media (max-width: 500px) {

    .order-header {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>
</head>


<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>BAYOUTA PARK</h1>

        <p>Connexion Réception</p>

        <div
        class="login-error"
        id="loginError">
        Email ou mot de passe incorrect.
        </div>

        <div class="form-group">

            <label>Email</label>

            <input
            type="email"
            id="email"
            placeholder="Votre email">

        </div>


        <div class="form-group">

            <label>Mot de passe</label>

            <input
            type="password"
            id="password"
            placeholder="Votre mot de passe">

        </div>


        <button
        class="login-button"
        id="loginButton"
        onclick="login()">

        Se connecter

        </button>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard">


<header>

    <div class="logo">
    BAYOUTA PARK
    </div>

    <div class="subtitle">
    Tableau de réception
    </div>

    <button
    class="logout-button"
    onclick="logout()">

    Déconnexion

    </button>

</header>


<div class="status-bar">

    <div
    class="connection"
    id="connection">

    Connexion...

    </div>

</div>


<main class="orders-container">


<!-- NEW -->

<div class="status-section">

    <div class="status-title">
    🆕 Nouvelles commandes
    </div>

    <div id="newOrders">

        <div class="no-orders">
        Aucune nouvelle commande
        </div>

    </div>

</div>


<!-- PREPARING -->

<div class="status-section">

    <div class="status-title">
    🔵 En préparation
    </div>

    <div id="preparingOrders">

        <div class="no-orders">
        Aucune commande en préparation
        </div>

    </div>

</div>


<!-- DONE -->

<div class="status-section">

    <div class="status-title">
    🟢 Commandes prêtes
    </div>

    <div id="doneOrders">

        <div class="no-orders">
        Aucune commande prête
        </div>

    </div>

</div>


</main>

</div>


<script type="module">


/* ================= FIREBASE ================= */


import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ================= CONFIG ================= */


const firebaseConfig = {

    apiKey:
    "AIzaSyAbG_ateon42nWNrlK0QnyTHNwyxGop2ow",

    authDomain:
    "restaurant-ordering-syst-915da.firebaseapp.com",

    projectId:
    "restaurant-ordering-syst-915da",

    storageBucket:
    "restaurant-ordering-syst-915da.firebasestorage.app",

    messagingSenderId:
    "129974228020",

    appId:
    "1:129974228020:web:bfe09a72dee9f73c152661"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* ================= LOGIN ================= */


window.login = async function() {

    const email =
    document
    .getElementById("email")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value;


    const error =
    document
    .getElementById("loginError");


    try {

        await signInWithEmailAndPassword(

            auth,

            email,

            password

        );

        error.style.display =
        "none";

    }

    catch(errorObject) {

        console.error(errorObject);

        error.textContent =
        "Email ou mot de passe incorrect.";

        error.style.display =
        "block";

    }

};


/* ================= LOGOUT ================= */


window.logout = async function() {

    await signOut(auth);

};


/* ================= AUTH ================= */


onAuthStateChanged(

    auth,

    function(user) {

        if(user) {

            document
            .getElementById("loginPage")
            .style
            .display =
            "none";


            document
            .getElementById("dashboard")
            .style
            .display =
            "block";


            loadOrders();

        }

        else {

            document
            .getElementById("loginPage")
            .style
            .display =
            "flex";


            document
            .getElementById("dashboard")
            .style
            .display =
            "none";

        }

    }

);


/* ================= LOAD ORDERS ================= */


/*
IMPORTANT:

We listen to ALL orders.

We do NOT use:

where("status", "==", "new")

Therefore an order will NOT disappear
just because its status changes.
*/


function loadOrders() {


    const connection =
    document
    .getElementById("connection");


    onSnapshot(

        collection(
        db,
        "orders"
        ),

        function(snapshot) {


            connection.textContent =
            "🟢 Connecté — Commandes en direct";


            const newOrders =
            document
            .getElementById("newOrders");


            const preparingOrders =
            document
            .getElementById("preparingOrders");


            const doneOrders =
            document
            .getElementById("doneOrders");


            newOrders.innerHTML =
            "";


            preparingOrders.innerHTML =
            "";


            doneOrders.innerHTML =
            "";


            let newCount =
            0;


            let preparingCount =
            0;


            let doneCount =
            0;


            snapshot.forEach(

                function(orderDoc) {


                    const order =
                    orderDoc.data();


                    const id =
                    orderDoc.id;


                    /*
                    NEW
                    */

                    if(
                    order.status === "new"
                    ) {

                        newOrders
                        .appendChild(

                            createOrderCard(
                            id,
                            order,
                            "new"
                            )

                        );

                        newCount++;

                    }


                    /*
                    PREPARING
                    */

                    else if(
                    order.status === "preparing"
                    ) {

                        preparingOrders
                        .appendChild(

                            createOrderCard(
                            id,
                            order,
                            "preparing"
                            )

                        );

                        preparingCount++;

                    }


                    /*
                    DONE
                    */

                    else if(
                    order.status === "done"
                    ) {

                        doneOrders
                        .appendChild(

                            createOrderCard(
                            id,
                            order,
                            "done"
                            )

                        );

                        doneCount++;

                    }


                    /*
                    DELIVERED

                    If status is delivered,
                    we do nothing.

                    It disappears from the
                    active reception dashboard.

                    But it remains in Firebase.
                    */

                }

            );


            if(
            newCount === 0
            ) {

                newOrders.innerHTML = `

                <div class="no-orders">

                Aucune nouvelle commande

                </div>

                `;

            }


            if(
            preparingCount === 0
            ) {

                preparingOrders.innerHTML = `

                <div class="no-orders">

                Aucune commande en préparation

                </div>

                `;

            }


            if(
            doneCount === 0
            ) {

                doneOrders.innerHTML = `

                <div class="no-orders">

                Aucune commande prête

                </div>

                `;

            }


        },


        function(error) {

            console.error(error);

            connection.textContent =
            "🔴 Erreur de connexion";

        }

    );

}


/* ================= CREATE ORDER CARD ================= */


function createOrderCard(

    orderId,

    order,

    status

) {


    const card =
    document
    .createElement("div");


    card.className =
    "order-card";


    if(
    status === "new"
    ) {

        card.classList.add(
        "new-card"
        );

    }


    if(
    status === "preparing"
    ) {

        card.classList.add(
        "preparing-card"
        );

    }


    if(
    status === "done"
    ) {

        card.classList.add(
        "done-card"
        );

    }


    let itemsHTML =
    "";


    if(
    order.items &&
    Array.isArray(order.items)
    ) {


        order.items.forEach(

            function(item) {


                itemsHTML += `

                <div class="item">

                    <span>

                    ${item.quantity}
                    ×
                    ${item.name}

                    </span>

                    <span>

                    ${
                    item.price *
                    item.quantity
                    }
                    TND

                    </span>

                </div>

                `;

            }

        );

    }


    let timeText =
    "Heure inconnue";


    if(
    order.createdAt
    ) {

        try {

            timeText =
            order.createdAt
            .toDate()
            .toLocaleString("fr-FR");

        }

        catch(error) {

            timeText =
            "Heure inconnue";

        }

    }


    const shortId =
    orderId
    .substring(
    0,
    6
    )
    .toUpperCase();


    let buttonHTML =
    "";


    /*
    NEW:

    Accept
    new -> preparing
    */


    if(
    status === "new"
    ) {

        buttonHTML = `

        <button
        class="action-button accept-button"
        onclick="changeStatus(
        '${orderId}',
        'preparing'
        )">

        ✓ Accepter
        — Envoyer en préparation

        </button>

        `;

    }


    /*
    DONE:

    Delivered
    done -> delivered

    Then it disappears.
    */


    if(
    status === "done"
    ) {

        buttonHTML = `

        <button
        class="action-button delivered-button"
        onclick="changeStatus(
        '${orderId}',
        'delivered'
        )">

        ✓ Commande livrée

        </button>

        `;

    }


    card.innerHTML = `

    <div class="order-header">


        <div class="order-number">

        Commande #${shortId}

        </div>


        <div class="table">

        🪑 Table
        ${order.tableNumber || "?"}

        </div>


    </div>


    <div class="customer">

    👤
    ${order.customerName || "Client"}

    </div>


    <div class="order-time">

    🕐
    ${timeText}

    </div>


    <div class="items">

    ${itemsHTML}

    </div>


    <div class="total">

        <span>

        Total

        </span>


        <span>

        ${order.total || 0}
        TND

        </span>

    </div>


    ${buttonHTML}


    `;


    return card;

}


/* ================= CHANGE STATUS ================= */


window.changeStatus = async function(

    orderId,

    newStatus

) {


    console.log(
    "Changing order:",
    orderId,
    "to:",
    newStatus
    );


    try {


        await updateDoc(

            doc(

                db,

                "orders",

                orderId

            ),

            {

                status:
                newStatus

            }

        );


        console.log(
        "Status successfully changed to:",
        newStatus
        );


    }


    catch(error) {


        console.error(
        "Error changing status:",
        error
        );


        alert(

        "Erreur: "
        +
        error.message

        );

    }

};


</script>

</body>
</html>
